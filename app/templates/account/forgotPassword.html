<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link href="{{url_for('static', filename='styles/account.css')}}" rel="stylesheet" />

</head>

<body>

    <!-- Flash Message Section -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash-message flash-{{ category }}">
            <span class="flash-text">{{ message }}</span>
            <button class="flash-close">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <!-- Header -->
    <div class="top-nav">
        <div class="nav-container">
            <div class="logo">
                <a href="{{url_for('auth.login')}}">
                    <img id="siteLogo" src="{{ url_for('static', filename='images/logo4.jpeg') }}" alt="SetOhil Logo">
                </a>
            </div>
        </div>
    </div>

    <br>
    <!-- Sign In Section -->
    <main>
        <section id="signIn">
            <h2>Please enter your email address and phone number</h2>
            <form id="signIn-form" method="POST">

                <div class="SignInContainer">

                    <div class="createAccountField">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                        <small id="emailError" style="color:red;"></small>
                    </div>

                    <br>

                    <div class="createAccountField">
                        <label for="phoneNumber">Phone Number</label>
                        <div class="phone-input">
                            <span id="country-code">+267</span>
                            <input type="tel" id="phoneNumber" name="phoneNumber" pattern="7[0-9]{7}" maxlength="8"
                                inputmode="numeric" required>
                        </div>
                        <small id="phoneError" style="color: #ff0000;"></small>
                    </div>

                    <br>

                    <button type="submit" id="SignInBtn">Continue</button>

                </div>
            </form>
        </section>
    </main>

    <!-- JS Validation -->

    <script>
        // Email validation
        const email = document.getElementById("email");
        const emailError = document.getElementById("emailError");
        email.addEventListener("input", () => {
            if (email.validity.typeMismatch) {
                emailError.textContent = "Please enter a valid email address";
            } else {
                emailError.textContent = "";
            }
        });
    </script>


    <script>
        const phoneInput = document.getElementById("phoneNumber");
        const phoneError = document.getElementById("phoneError");

        phoneInput.addEventListener("input", () => {
            const value = phoneInput.value.trim();

            // Check if it starts with 7
            if (!/^7\d{7}$/.test(value)) {
                phoneError.textContent = "Phone number must start with 7 and be exactly 8 digits.";
                phoneInput.setCustomValidity("Invalid phone number");
            } else {
                phoneError.textContent = "";
                phoneInput.setCustomValidity(""); // reset validity
            }
        });
    </script>


    <!-- JavaScript for Auto Dismiss Flash Message -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const flashes = document.querySelectorAll(".flash-message");

            flashes.forEach((flash) => {
                // Auto-dismiss after 4 seconds
                setTimeout(() => {
                    flash.style.animation = "fadeOut 0.4s ease forwards";
                    setTimeout(() => flash.remove(), 400);
                }, 4000);

                // Manual close
                flash.querySelector(".flash-close").addEventListener("click", () => {
                    flash.style.animation = "fadeOut 0.4s ease forwards";
                    setTimeout(() => flash.remove(), 400);
                });
            });
        });
    </script>



</body>

</html>
