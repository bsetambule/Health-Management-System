<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="{{ url_for('static', filename='styles/account.css') }}" rel="stylesheet" />
</head>

<body>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash-message flash-{{ category }}">
            <span class="flash-text">{{ message }}</span>
            <button class="flash-close">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <!-- Header -->
    <div class="top-nav">
        <div class="nav-container">
            <div class="logo">
                <img id="siteLogo" src="{{ url_for('static', filename='images/logo4.jpeg') }}" alt="SetOhil Logo">
            </div>
        </div>
    </div>

    <br>
    <!-- Reset Password Form -->
    <main>
        <section id="resetPassword">
            <h2>Reset Your Password</h2>
            <br>
            <form id="confirmPassword-form" method="POST">

                <div class="ResetPasswordContainer">

                    <div class="createAccountField" style="position: relative;">
                        <label for="new_password">New Password</label>
                        <input type="password" id="new_password" name="new_password" required minlength="15"
                            pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&]).{15,}"
                            title="Password must be at least 15 characters long and include uppercase, lowercase, number, and special character">
                        <span class="togglePassword" id="togglePassword"
                            style="position:absolute; right:10px; top:60%; transform:translateY(-50%); cursor:pointer;">
                            Show
                        </span>
                        <small id="newPasswordError" style="color:#ff0000;"></small>
                    </div>

                    <br>

                    <div class="createAccountField" style="position: relative;">
                        <label for="confirm_password">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="15"
                            pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&]).{15,}">
                        <span class="togglePassword" id="togglePassword"
                            style="position:absolute; right:10px; top:60%; transform:translateY(-50%); cursor:pointer;">
                            Show
                        </span>
                        <small id="confirmPasswordError" style="color:#ff0000;"></small>
                    </div>

                    <br>
                    <button type="submit" id="resetPasswordBtn">Create Password</button>
                </div>
            </form>
        </section>
    </main>

    <!--Toggle Password Visibility-->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const togglePasswordElements = document.querySelectorAll(".togglePassword");

            togglePasswordElements.forEach(toggle => {
                toggle.addEventListener("click", function () {
                    // Find the input in the same container
                    const passwordInput = this.previousElementSibling; // assumes input is just before the span
                    if (passwordInput.type === "password") {
                        passwordInput.type = "text";
                        this.textContent = "Hide";
                    } else {
                        passwordInput.type = "password";
                        this.textContent = "Show";
                    }
                });
            });
        });
    </script>



    <!-- JS Validation -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            // Flash messages
            const flashes = document.querySelectorAll(".flash-message");
            flashes.forEach(flash => {
                setTimeout(() => {
                    flash.style.animation = "fadeOut 0.4s ease forwards";
                    setTimeout(() => flash.remove(), 400);
                }, 4000);

                flash.querySelector(".flash-close").addEventListener("click", () => {
                    flash.style.animation = "fadeOut 0.4s ease forwards";
                    setTimeout(() => flash.remove(), 400);
                });
            });

            // Password validation
            const newPassword = document.getElementById("new_password");
            const confirmPassword = document.getElementById("confirm_password");
            const newPasswordError = document.getElementById("newPasswordError");
            const confirmPasswordError = document.getElementById("confirmPasswordError");

            function validatePasswords() {
                let valid = true;

                if (!newPassword.validity.valid) {
                    newPasswordError.textContent = newPassword.title;
                    valid = false;
                } else {
                    newPasswordError.textContent = "";
                }

                if (confirmPassword.value !== newPassword.value) {
                    confirmPasswordError.textContent = "Passwords do not match.";
                    valid = false;
                } else {
                    confirmPasswordError.textContent = "";
                }

                return valid;
            }

            newPassword.addEventListener("input", validatePasswords);
            confirmPassword.addEventListener("input", validatePasswords);

            // Prevent form submission if invalid
            const form = document.getElementById("confirmPassword-form");
            form.addEventListener("submit", (e) => {
                if (!validatePasswords()) {
                    e.preventDefault();
                }
            });
        });
    </script>

</body>

</html>
