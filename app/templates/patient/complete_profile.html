<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>

        Complete Profile
    </title>
    <link href="{{url_for('static', filename='styles/profile.css')}}" rel="stylesheet" />
    <script>
        try {
            if (localStorage.getItem("darkMode") === "enabled") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        } catch (e) { }
    </script>
</head>

<body>

    <!-- Flash Message Section -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash-message flash-{{ category }}">
            <span class="flash-text">{{ message }}</span>
            <button class="flash-close">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}


    <div class="main">
        <!--<div class="customerProfile-container">-->
        <section>
            <h2>
                Finish Setting Up Your Account
            </h2>
            <br>
            <p>
                Please complete your profile before using system.
            </p>
            <br>
            <!-- Create Account Section -->

            <!--<section id="createProfile">--->

            <form id="createProfile-form" method="POST">


                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" min="1940-12-31" max="2009-12-31" required>
                </div>
                <br>

                <div class="form-group">
                    <label for="sex">Sex</label>
                    <select id="sex" name="sex" required>
                        <option value="" disabled selected>Select your sex</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <br>

                <div class="form-group">
                    <label for="center">Preferred Hospital/Clinic</label>
                    <select id="center" name="center" required>
                        <option value="" disabled selected>Select a Hospital/Clinic</option>
                        {% for center in hospitals %}
                        <option value="{{ center.centerID }}">
                            {{ center.centerName }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="pharmacy">Preferred Pharmacy</label>
                    <select id="pharmacy" name="pharmacy" required>
                        <option value="" disabled selected>Select a Pharmacy</option>
                        {% for pharmacy in pharmacies %}
                        <option value="{{ pharmacy.centerID }}">
                            {{ pharmacy.centerName }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="allergies">Known Allergies (if any)</label>
                    <textarea id="allergies" name="allergies" rows="3"
                        placeholder="e.g. Penicillin, Peanuts, Latex..."></textarea>
                </div>
                <br>


                <button type="submit" class="profileBtn">
                    Create Profile
                </button>
            </form>
        </section>
    </div>


    <!-- FOOTER -->
    <footer class="indexFooter">
        <div class="footer-logo">
            <a href="#">
                <img id="footerLogo" src="{{ url_for('static', filename='images/logo4.jpeg') }}" alt="SetOhil Logo">
            </a>
        </div>
        <hr>

        <div class="copyright">
            <p>© SetOhil 2026</p>
        </div>
    </footer>


    <!-- JavaScript for Auto Dismiss Flash Message -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const flashes = document.querySelectorAll(".flash-message");

            flashes.forEach((flash) => {
                // Auto-dismiss after 4 seconds
                setTimeout(() => {
                    flash.style.animation = "fadeOut 0.4s ease forwards";
                    setTimeout(() => flash.remove(), 400);
                }, 4000);

                // Manual close
                flash.querySelector(".flash-close").addEventListener("click", () => {
                    flash.style.animation = "fadeOut 0.4s ease forwards";
                    setTimeout(() => flash.remove(), 400);
                });
            });
        });
    </script>

    <!-- JavaScript for Dark Mode Toggle, Hamburger Menu, and Auto Dismiss Flash Message -->
    <script>
        const darkToggle = document.getElementById("darkModeToggle");
        const logo = document.getElementById("siteLogo");
        const footerLogo = document.getElementById("footerLogo");
        const hamburger = document.getElementById("hamburger");
        const sidebar = document.querySelector(".sidebar");

        // Update logos based on dark mode
        function updateLogo() {
            const isDark = document.documentElement.getAttribute("data-theme") === "dark";
            logo.src = isDark ? "{{ url_for('static', filename='images/logo2.png') }}"
                : "{{ url_for('static', filename='images/logo4.jpeg') }}";
            footerLogo.src = isDark ? "{{ url_for('static', filename='images/logo2.png') }}"
                : "{{ url_for('static', filename='images/logo4.jpeg') }}";
        }

        // Dark Mode Toggle
        if (localStorage.getItem("darkMode") === "enabled") {
            document.documentElement.setAttribute("data-theme", "dark");
            darkToggle.checked = true;
        } else {
            document.documentElement.setAttribute("data-theme", "light");
        }

        updateLogo();

        darkToggle.addEventListener("change", () => {
            const isDark = document.documentElement.getAttribute("data-theme") === "dark";
            document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
            localStorage.setItem("darkMode", isDark ? "disabled" : "enabled");

            updateLogo();
        });

        // Hamburger Menu Toggle for smaller screens
        hamburger.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            hamburger.classList.toggle("active");
        });
    </script>

    <!--INACTIVITY SCRIPT-->
    <script>
        let inactivityTime = function () {
            let timer;

            // Function to logout after inactivity
            const logout = () => {
                window.location.href = "/logout";  // Redirect to logout
            }

            // Function to reset the inactivity timer
            const resetTimer = () => {
                clearTimeout(timer);
                // Send request to keep the session alive
                fetch("/keep_alive");
                // Reset inactivity timer (logout after 10 minutes of inactivity)
                timer = setTimeout(logout, 10 * 60 * 1000);  // 10 minutes
            }

            // Listen to various user events to reset the inactivity timer
            window.onload = resetTimer;
            document.onmousemove = resetTimer;
            document.onkeydown = resetTimer;
            document.onscroll = resetTimer;
            document.onclick = resetTimer;
        };

        inactivityTime();  // Initialize the inactivity timer
    </script>

</body>

</html>
